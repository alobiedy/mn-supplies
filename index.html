<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mama Noura Malzeme Anketi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: single narrow column, brand-blue header band with logo, one card per supply item */
:root{
  --brand:#096EB0; --brand-ink:#ffffff; --brand-soft:#E6F0F8;
  --bg:#F3F6F9; --surface:#ffffff; --fg:#14283A; --muted:#5B6F82; --line:#D6E1EA;
  --yes:#1E8A5A; --no:#C2412D; --warn-bg:#FFF6E0; --warn-fg:#7A5300;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#2F8FD3; --brand-ink:#ffffff; --brand-soft:#11314A;
  --bg:#0D1822; --surface:#14222F; --fg:#E4EDF4; --muted:#93A8BA; --line:#24384A;
  --yes:#3DBB83; --no:#F07560; --warn-bg:#3A2E10; --warn-fg:#F5D17A; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#2F8FD3; --brand-ink:#ffffff; --brand-soft:#11314A;
  --bg:#0D1822; --surface:#14222F; --fg:#E4EDF4; --muted:#93A8BA; --line:#24384A;
  --yes:#3DBB83; --no:#F07560; --warn-bg:#3A2E10; --warn-fg:#F5D17A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
header{background:#096EB0;color:#fff;padding-block:28px 64px;padding-inline:16px}
.hwrap{max-width:640px;margin:0 auto;display:flex;gap:16px;align-items:center}
.hwrap img{width:64px;height:64px;border-radius:14px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
header h1{margin:0;font-size:1.5rem;font-weight:700;text-wrap:balance;line-height:1.2}
header p{margin:4px 0 0;opacity:.88;font-size:.95rem}
main{max-width:640px;margin:-40px auto 0;padding-inline:16px;padding-block:0 48px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:1.05rem;font-weight:600;display:flex;gap:10px;align-items:center}
.step{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:.85rem;font-weight:700;flex:none}
label.q{font-weight:500}
.hint{color:var(--muted);font-size:.875rem;margin:0}
select,input[type=number],input[type=text]{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
select:focus,input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field{display:flex;flex-direction:column;gap:8px}
.yn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn label{border:1.5px solid var(--line);border-radius:10px;padding:12px;text-align:center;font-weight:600;cursor:pointer;user-select:none}
.yn input:focus-visible+label{box-shadow:0 0 0 3px var(--brand-soft);border-color:var(--brand)}
.yn input[value=yes]:checked+label{border-color:var(--yes);color:var(--yes);background:color-mix(in srgb,var(--yes) 10%,transparent)}
.yn input[value=none]:checked+label{border-color:var(--muted);color:var(--fg);background:var(--brand-soft)}
.yn input[value=no]:checked+label{border-color:var(--no);color:var(--no);background:color-mix(in srgb,var(--no) 10%,transparent)}
.sub{border-left:3px solid var(--brand-soft);padding-left:14px;display:flex;flex-direction:column;gap:8px}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:12px 14px;font-size:.9rem}
.err{color:var(--no);font-size:.9rem;font-weight:500}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 18px;background:var(--brand);color:var(--brand-ink);cursor:pointer;width:100%;font-size:1rem}
button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--brand-soft);outline-offset:2px}
.done{text-align:center;align-items:center;padding-block:36px}
.done .tick{width:60px;height:60px;border-radius:50%;background:color-mix(in srgb,var(--yes) 14%,transparent);color:var(--yes);display:grid;place-items:center;font-size:2rem;font-weight:700}
.done h2{justify-content:center;font-size:1.3rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.875rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600}
.pill.y{color:var(--yes);background:color-mix(in srgb,var(--yes) 12%,transparent)}
.pill.n{color:var(--no);background:color-mix(in srgb,var(--no) 12%,transparent)}
.pill.w{color:var(--muted);background:var(--brand-soft)}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .2s}}
header .top{max-width:640px;margin:0 auto 16px;display:flex;justify-content:flex-end}
.lang{display:inline-flex;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden}
.lang button{width:auto;background:transparent;color:#fff;border-radius:0;padding:6px 14px;font-size:.85rem}
.lang button[aria-pressed=true]{background:#fff;color:#096EB0}
textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:120px;resize:vertical}
textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.counter{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.opt{font-weight:400;color:var(--muted);font-size:.85rem}
.adminhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.adminhead button{width:auto;padding:10px 16px;font-size:.9rem}
td.note{white-space:normal;min-width:220px;max-width:360px}
</style>
<style>body{margin:0}</style>
</head>

 en:{title:"Branch Supplies Survey",subtitle:"Report the status of receipt printers, barcode scanners and POS fingerprint readers. Takes about 2 minutes.",

let L="tr";
try{const s=localStorage.getItem("mn-lang"); if(s==="en"||s==="tr") L=s;}catch(e){}
const t=k=>T[L][k];

const BRANCHES=["Al Yarmuk","Al Nada","Al Suwaidi","King Faisal","Al Rahmanyia","Sulaymaniyah","Al Naseem","Al Dammam","Al Khobar","AlAarid"];
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const ITEMS=[{key:"printer",sec:"sec-printer"},{key:"backup",sec:"sec-backup"},{key:"scanner",sec:"sec-scanner"},{key:"fingerprint",sec:"sec-fingerprint"}];
const $=id=>document.getElementById(id);
let submitted={}, lastBranch="", lastName="";

const sel=$("branch");
BRANCHES.forEach(b=>{const o=document.createElement("option");o.value=b;sel.appendChild(o)});

ITEMS.forEach(it=>{
  $(it.sec).insertAdjacentHTML("beforeend",`
    <div class="field">
      <span class="q" data-t="q_${it.key}"></span>
      <div class="yn" role="radiogroup">
        <input type="radio" name="${it.key}" id="${it.key}-yes" value="yes"><label for="${it.key}-yes" data-t="yes"></label>
        <input type="radio" name="${it.key}" id="${it.key}-no" value="no"><label for="${it.key}-no" data-t="no"></label>
        <input type="radio" name="${it.key}" id="${it.key}-none" value="none"><label for="${it.key}-none" data-t="none"></label>
      </div>
    </div>
    <div class="sub" id="${it.key}-sub" hidden>
      <label class="q" for="${it.key}-qty" id="${it.key}-qlabel"></label>
      <input type="number" id="${it.key}-qty" min="1" step="1" inputmode="numeric">
    </div>`);
  document.querySelectorAll(`input[name=${it.key}]`).forEach(r=>r.addEventListener("change",()=>{$(it.key+"-sub").hidden=r.value==="none";qtyLabel(it.key)}));
});
function qtyLabel(k){const r=document.querySelector(`input[name=${k}]:checked`); if(r) $(k+"-qlabel").textContent=r.value==="yes"?t("qtyHave"):t("qtyNeed");}

function applyLang(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t(el.dataset.t)});
  $("name").placeholder=t("namePh");
  ITEMS.forEach(it=>{$(it.key+"-qty").placeholder=t("min1");qtyLabel(it.key)});
  $("lang-tr").setAttribute("aria-pressed",L==="tr");$("lang-en").setAttribute("aria-pressed",L==="en");
  if(!$("submit").disabled) $("submit").textContent=t("submit");
  if(lastBranch) $("doneText").textContent=t("doneT")(lastBranch,lastName);
  if(!$("err").hidden && $("err").dataset.k) $("err").textContent=t($("err").dataset.k);
  markSubmitted();
}
function setLang(l){L=l;try{localStorage.setItem("mn-lang",l)}catch(e){};applyLang();}
$("lang-tr").onclick=()=>setLang("tr"); $("lang-en").onclick=()=>setLang("en");

$("notes").addEventListener("input",e=>{$("ncount").textContent=e.target.value.length.toLocaleString("tr-TR")});

function showErr(k){const e=$("err");e.dataset.k=k||"";e.textContent=k?t(k):"";e.hidden=!k}

function markSubmitted(){
  [...sel.options].forEach(o=>{
    if(!o.value) return;
    const s=!!submitted[slug(o.value)];
    o.disabled=s; o.textContent=o.value+(s?t("submitted"):"");
  });
  if(sel.value && submitted[slug(sel.value)]) sel.value="";
}

// ===== Google Apps Script web app URL (paste yours here) =====
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwDL-Jbd7ry4a1WHE04sOuOWSbuv91p9lEvbmCK9_5AnRX66MwhWuv9SA8rpZ3Xknkj/exec";

const api=async(body)=>{
  const opt=body?{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}:{};
  const r=await fetch(SCRIPT_URL,opt); return r.json();
};
const configured=()=>/^https:\/\/script\.google\.com\//.test(SCRIPT_URL);

async function loadSubmitted(){
  if(!configured()) return;
  try{const j=await api(); if(j&&j.ok){submitted={};(j.submitted||[]).forEach(b=>submitted[slug(b)]=true);markSubmitted();}}catch(e){}
}

$("form").addEventListener("submit",async e=>{
  e.preventDefault(); showErr("");
  const branch=sel.value;
  if(!branch) return showErr("eBranch");
  const data={branch};
  for(const it of ITEMS){
    const r=document.querySelector(`input[name=${it.key}]:checked`);
    if(!r) return showErr("eYN");
    if(r.value==="none"){ data[it.key]={status:"none",qty:0}; continue; }
    const q=parseInt($(it.key+"-qty").value,10);
    if(!Number.isInteger(q)||q<1) return showErr("eQty");
    data[it.key]={status:r.value,qty:q};
  }
  const name=$("name").value.trim();
  if(name.length<2) return showErr("eName");
  data.name=name;
  data.notes=$("notes").value.trim().slice(0,32767);
  data.lang=L;
  if(!configured()) return showErr("eConn");
  const btn=$("submit"); btn.disabled=true; btn.textContent=t("sending");
  try{
    const j=await api(data);
    if(!j||!j.ok){
      if(j&&j.error==="duplicate"){ submitted[slug(branch)]=true; markSubmitted(); throw {k:"eDup"}; }
      throw {k:"eFail"};
    }
    submitted[slug(branch)]=true;
    lastBranch=branch; lastName=name;
    $("form").hidden=true; $("done").hidden=false;
    $("doneText").textContent=t("doneT")(branch,name);
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(err){
    showErr(err&&err.k?err.k:"eFail");
    btn.disabled=false; btn.textContent=t("submit");
  }
});

applyLang();
loadSubmitted();
</script>
